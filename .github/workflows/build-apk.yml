name: Build Madina Tent Service APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find V8 ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "ZIP found: $ZIP_FILE"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

      - name: Find Android Project
        run: |
          ROOT=$(find source -name settings.gradle.kts -print -quit | xargs dirname)
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project found at: $ROOT"

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MadinaTentService77F-debug-apk
          path: "${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk"
