name: Build Madina Tent Service APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V8.1 Clean ZIP
        shell: bash
        run: |
          set -e

          ZIP="./MadinaTentService77F_V8_2_Clean_Build.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: V8.1 Clean ZIP not found."
            echo "Files in repository:"
            ls -lah
            exit 1
          fi

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          ROOT="$(find project -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"

          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle.kts not found after extraction."
            find project -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Project root: $ROOT"

          test -d "$ROOT/app"
          test -f "$ROOT/app/build.gradle.kts"
          test -f "$ROOT/gradlew"

          chmod +x "$ROOT/gradlew"

          echo "Starting Android build..."

          cd "$ROOT"

          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MadinaTentService77F-debug-apk
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
