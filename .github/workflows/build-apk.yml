name: Build Madina Tent Service APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find V8 ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "ZIP: $ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

      - name: Fix Java and Kotlin JVM Target
        run: |
          echo "Fixing Android project settings..."
          find source -name "build.gradle.kts" -type f -print0 | while IFS= read -r -d '' FILE; do
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$FILE"
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$FILE"
          done

      - name: Find Android Project
        run: |
          ROOT=$(find source -name settings.gradle.kts -print -quit | xargs dirname)
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project: $ROOT"

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MadinaTentService77F-debug-apk
          path: "${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk"
